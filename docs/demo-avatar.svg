<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A shepherd's pie with a portion taken out: mashed potato over mince, in an oval baking dish. -->
  <defs>
    <!-- Where the portion was: the mash is gone here. -->
    <mask id="mash">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M32 31 L71 37 L63 64 L41 70 Z" fill="#000"/>
    </mask>
    <!-- The mince shows along the cut faces: the same wedge, nudged down and in, cuts it back to a band. -->
    <mask id="mince">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M34.5 35.5 L71 41.5 L63 64 L43.5 70 Z" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" fill="#f6e7c8"/>
  <!-- The dish -->
  <ellipse cx="32" cy="35" rx="29" ry="25" fill="#c65a3a"/>
  <ellipse cx="32" cy="33.5" rx="26" ry="22" fill="#e9e2d6"/>
  <!-- Mince, with peas and carrot -->
  <g mask="url(#mince)">
    <ellipse cx="32" cy="34" rx="23.5" ry="19.5" fill="#6b3a22"/>
    <circle cx="41" cy="37" r="1.4" fill="#7bbf4a"/><circle cx="36" cy="41" r="1.3" fill="#e8892b"/>
    <circle cx="45" cy="40" r="1.2" fill="#e8892b"/><circle cx="38.5" cy="45" r="1.3" fill="#7bbf4a"/>
    <circle cx="48" cy="36.5" r="1.2" fill="#7bbf4a"/>
  </g>
  <!-- Mashed potato, with fork ridges and browned peaks -->
  <g mask="url(#mash)">
    <ellipse cx="32" cy="31.5" rx="23.5" ry="19.5" fill="#f2d98f"/>
    <g fill="none" stroke="#d6ad55" stroke-width="1.6" stroke-linecap="round">
      <path d="M13 26q5-4 10 0t10 0 10 0 10 0"/>
      <path d="M11 33q5-4 10 0t10 0 10 0 10 0"/>
      <path d="M14 40q5-4 10 0t10 0 10 0 10 0"/>
      <path d="M20 19q4-3 8 0t8 0 8 0"/>
    </g>
    <g fill="#c4802f">
      <circle cx="18" cy="24" r="1.5"/><circle cx="28" cy="23" r="1.3"/><circle cx="38" cy="24" r="1.5"/>
      <circle cx="16" cy="31" r="1.3"/><circle cx="26" cy="31" r="1.5"/><circle cx="46" cy="30" r="1.3"/>
      <circle cx="21" cy="38" r="1.5"/><circle cx="31" cy="39" r="1.3"/><circle cx="25" cy="17" r="1.2"/><circle cx="41" cy="17" r="1.2"/>
    </g>
  </g>
</svg>
